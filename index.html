<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#120c08" />
    <meta name="description" content="Shadowplay: a hand-shadow theatre for Meta Quest. Your real wall becomes a stage; shape the shadow and it comes alive." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f3d9a4'/%3E%3Cpath d='M14 40c6-10 14-14 24-14l10-8 2 4-6 6c4 1 6 3 6 6H24z' fill='%23140d08'/%3E%3C/svg%3E" />
    <title>Shadowplay</title>
    <style>
      :root {
        --ink: #140d08;
        --cream: #fff1d6;
        --gold: #f3c97a;
        --dim: rgba(255, 241, 214, 0.72);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ink);
        color: var(--cream);
        font-family: Georgia, 'Noto Serif', 'Times New Roman', serif;
      }
      #scene-container {
        position: fixed;
        inset: 0;
      }
      #landing {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 120%, rgba(20, 13, 8, 0.95) 20%, rgba(20, 13, 8, 0) 70%);
        transition: opacity 0.8s ease;
      }
      #landing.hidden {
        opacity: 0;
      }
      .card {
        pointer-events: auto;
        max-width: 560px;
        margin: 0 16px 6vh;
        text-align: center;
      }
      h1 {
        font-style: italic;
        font-weight: normal;
        font-size: clamp(40px, 8vw, 72px);
        margin: 0 0 8px;
        letter-spacing: 0.02em;
        text-shadow: 0 0 24px rgba(243, 201, 122, 0.55);
      }
      p {
        margin: 0 0 18px;
        line-height: 1.5;
        color: var(--dim);
        font-size: 17px;
      }
      .row {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        font-size: 18px;
        border-radius: 999px;
        padding: 12px 26px;
        cursor: pointer;
        border: 1px solid var(--gold);
        background: var(--gold);
        color: var(--ink);
      }
      button.ghost {
        background: transparent;
        color: var(--cream);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #pip {
        position: fixed;
        right: 16px;
        bottom: 16px;
        width: min(28vw, 240px);
        aspect-ratio: 16 / 9;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(243, 201, 122, 0.45);
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.5);
        display: none;
        background: #000;
      }
      #pip video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
      }
      #status {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(20, 13, 8, 0.75);
        color: var(--cream);
        font-size: 15px;
        display: none;
        max-width: calc(100vw - 32px);
        text-align: center;
      }
      small {
        display: block;
        margin-top: 14px;
        color: rgba(255, 241, 214, 0.5);
        font-size: 13px;
      }
      .aloud {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        color: var(--dim);
        font-size: 15px;
        cursor: pointer;
      }
      .aloud input {
        accent-color: var(--gold);
        width: 18px;
        height: 18px;
      }
      #book {
        margin: 18px auto 0;
        max-width: 520px;
        text-align: left;
        color: var(--dim);
        font-size: 15px;
      }
      #book summary {
        cursor: pointer;
        text-align: center;
        color: var(--gold);
        font-style: italic;
        list-style: none;
      }
      #book summary::-webkit-details-marker {
        display: none;
      }
      #book ol {
        list-style: none;
        margin: 10px 0 0;
        padding: 12px 16px;
        max-height: 34vh;
        overflow-y: auto;
        border-radius: 14px;
        background: rgba(20, 13, 8, 0.72);
        border: 1px solid rgba(243, 201, 122, 0.25);
      }
      #book li + li {
        margin-top: 12px;
      }
      #book .t {
        color: var(--cream);
        font-style: italic;
      }
      #book .m {
        display: block;
        font-size: 12px;
        opacity: 0.6;
      }
      #tonight {
        margin: 14px auto 0;
        max-width: 520px;
        font-size: 15px;
        color: var(--dim);
      }
      #tonight .moon {
        color: var(--gold);
      }
      #tonight q {
        display: block;
        margin-top: 4px;
        font-style: italic;
        color: var(--cream);
      }
      #access {
        margin: 14px auto 0;
        max-width: 520px;
        text-align: left;
        color: var(--dim);
        font-size: 15px;
      }
      #access summary {
        cursor: pointer;
        text-align: center;
        color: var(--gold);
        font-style: italic;
        list-style: none;
      }
      #access summary::-webkit-details-marker {
        display: none;
      }
      #access .opts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 18px;
        margin: 10px 0 0;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(20, 13, 8, 0.72);
        border: 1px solid rgba(243, 201, 122, 0.25);
      }
      #access label {
        display: grid;
        grid-template-columns: 20px 1fr;
        gap: 2px 8px;
        align-items: start;
        cursor: pointer;
      }
      #access input {
        accent-color: var(--gold);
        width: 18px;
        height: 18px;
        margin: 2px 0 0;
      }
      #access .l {
        color: var(--cream);
      }
      #access .d {
        grid-column: 2;
        font-size: 12.5px;
        line-height: 1.35;
        opacity: 0.75;
      }
      @media (max-width: 520px) {
        #access .opts {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="landing">
      <div class="card">
        <h1>Shadowplay</h1>
        <p>Your wall becomes a shadow theatre. A lantern glows over your shoulder and tells you a story, and your hands cast it: shape a shadow and it comes alive to play its part.</p>
        <div class="row">
          <button id="enter-xr" disabled>Checking for a headset…</button>
          <button id="webcam" class="ghost">Try with your webcam</button>
        </div>
        <label class="aloud" id="aloud" hidden><input type="checkbox" id="read-aloud" /> The Lantern reads the story aloud</label>
        <details id="access">
          <summary>Comfort &amp; access</summary>
          <div class="opts"></div>
        </details>
        <small>Best on Meta Quest with hand tracking, seated, facing a wall. No controllers needed. <span id="teller"></span></small>
        <p id="tonight" hidden></p>
        <details id="book" hidden>
          <summary></summary>
          <ol></ol>
        </details>
      </div>
    </div>
    <div id="pip"></div>
    <div id="status" role="status" aria-live="polite"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
